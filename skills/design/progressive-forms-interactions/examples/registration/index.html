<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<!--
  Reference implementation of the forms golden path (references/forms.md):
  enabled submit, validate on blur then per keystroke while in error, an error
  summary that takes focus on a failed submit, values kept, one request per
  submit, announced status, server-error and timeout recovery (the summary
  is announced by moving focus to it, so it carries no role="alert"), draft kept
  across a reload (never the password). Exercised by tests/registration.spec.mjs.
-->
<style>
  :root {
    --text: #1a1a1a; --muted: #4a4a4a; --surface: #ffffff; --line: #6b6b6b;
    --accent: #0b57d0; --error: #b3261e; --focus: #1a1a1a; --success: #146c2e;
    --radius: 6px; --gap: 1.25rem;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: var(--text); background: var(--surface); }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 1.5rem; }
  .field { margin-bottom: var(--gap); }
  label { display: block; font-weight: 600; margin-bottom: .25rem; }
  .hint { color: var(--muted); font-size: .9375rem; margin: 0 0 .375rem; }
  input { width: 100%; font: inherit; padding: .625rem .75rem; min-height: 2.75rem;
          border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
  input[aria-invalid="true"] { border-color: var(--error); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .error { color: var(--error); font-weight: 600; margin: 0 0 .375rem; }
  .error[hidden] { display: none; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1 1 12rem; }
  button { font: inherit; font-weight: 600; min-height: 2.75rem; padding: .625rem 1.25rem; border-radius: var(--radius); cursor: pointer; }
  .primary { background: var(--accent); color: #fff; border: 2px solid var(--accent); }
  .secondary { background: var(--surface); color: var(--text); border: 2px solid var(--line); }
  .summary { border: 3px solid var(--error); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem; }
  .summary h2 { font-size: 1.125rem; margin: 0 0 .5rem; }
  .summary ul { margin: 0; padding-left: 1.25rem; }
  .summary a { color: var(--error); font-weight: 600; }
  .status { color: var(--success); font-weight: 600; min-height: 1.5rem; }
  @media (prefers-reduced-motion: no-preference) {
    .summary { animation: settle 160ms ease-out; }
    @keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <h1>Create your account</h1>

  <div id="summary" class="summary" tabindex="-1" aria-labelledby="summary-title" hidden></div>

  <form id="register" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <p id="name-error" class="error" hidden></p>
      <input id="name" name="name" autocomplete="name" required aria-describedby="name-error">
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <p id="email-hint" class="hint">We send a confirmation link here.</p>
      <p id="email-error" class="error" hidden></p>
      <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" required aria-describedby="email-hint email-error">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <p id="password-hint" class="hint">At least 12 characters. A short sentence works well.</p>
      <p id="password-error" class="error" hidden></p>
      <div class="row">
        <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error">
        <button type="button" class="secondary" id="toggle" aria-controls="password" aria-pressed="false">Show password</button>
      </div>
    </div>

    <button type="submit" class="primary" id="submit">Create account</button>
    <p id="status" class="status" role="status"></p>
  </form>
</main>

<script>
(() => {
  const form = document.getElementById("register");
  const summary = document.getElementById("summary");
  const status = document.getElementById("status");
  const submit = document.getElementById("submit");
  const baseTitle = document.title;
  const DRAFT = "registration-draft";
  const TIMEOUT_MS = 6000;
  let inFlight = false;

  // One rule per field; messages say what to do, not that something is "invalid".
  const rules = {
    name: (v) => v.trim() ? "" : "Enter your full name",
    email: (v) => !v.trim() ? "Enter your email address"
      : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? "" : "Enter an email address in the correct format, like name@example.com",
    password: (v) => !v ? "Enter a password"
      : v.length >= 12 ? "" : "Password must be 12 characters or more",
  };
  const touched = new Set();

  function show(name, message) {
    const input = form.elements[name];
    const error = document.getElementById(`${name}-error`);
    error.textContent = message ? `Error: ${message}` : "";
    error.hidden = !message;
    if (message) input.setAttribute("aria-invalid", "true");
    else input.removeAttribute("aria-invalid");
  }

  function validate(name) {
    const message = rules[name](form.elements[name].value);
    show(name, message);
    return message;
  }

  // Blur after the first edit, then every keystroke while the field is in error:
  // no message before the person has finished typing, no stale message after a fix.
  for (const name of Object.keys(rules)) {
    const input = form.elements[name];
    input.addEventListener("input", () => {
      touched.add(name);
      if (input.getAttribute("aria-invalid") === "true") validate(name);
      saveDraft();
    });
    input.addEventListener("blur", () => { if (touched.has(name)) validate(name); });
  }

  function saveDraft() {
    // The password is never persisted.
    try {
      localStorage.setItem(DRAFT, JSON.stringify({ name: form.elements.name.value, email: form.elements.email.value }));
    } catch {}
  }
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT) || "{}");
    if (draft.name) form.elements.name.value = draft.name;
    if (draft.email) form.elements.email.value = draft.email;
  } catch {}

  document.getElementById("toggle").addEventListener("click", (e) => {
    const field = form.elements.password;
    const showing = field.type === "text";
    field.type = showing ? "password" : "text";
    e.currentTarget.setAttribute("aria-pressed", String(!showing));
    e.currentTarget.textContent = showing ? "Show password" : "Hide password";
  });

  function renderSummary(errors) {
    summary.innerHTML = "";
    const heading = document.createElement("h2");
    heading.textContent = "There is a problem";
    heading.id = "summary-title";
    const list = document.createElement("ul");
    for (const [name, message] of errors) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = `#${name}`;
      link.textContent = message;
      link.addEventListener("click", (e) => { e.preventDefault(); form.elements[name].focus(); });
      item.append(link);
      list.append(item);
    }
    summary.append(heading, list);
    summary.hidden = false;
    document.title = `Error: ${baseTitle}`;
    summary.focus();
  }

  function fail(message) {
    summary.innerHTML = "";
    const heading = document.createElement("h2");
    heading.textContent = message;
    heading.id = "summary-title";
    summary.append(heading);
    summary.hidden = false;
    document.title = `Error: ${baseTitle}`;
    summary.focus();
  }

  function clearSummary() {
    summary.hidden = true;
    summary.innerHTML = "";
    document.title = baseTitle;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (inFlight) return; // a second click while sending is ignored, the button stays focusable
    const errors = Object.keys(rules).map((n) => [n, validate(n)]).filter(([, m]) => m);
    if (errors.length) { status.textContent = ""; renderSummary(errors); return; }

    clearSummary();
    inFlight = true;
    submit.textContent = "Creating account...";
    status.textContent = "";
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
      const response = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: form.elements.name.value, email: form.elements.email.value, password: form.elements.password.value }),
        signal: controller.signal,
      });
      if (!response.ok) throw new Error(String(response.status));
      try { localStorage.removeItem(DRAFT); } catch {}
      status.textContent = "Account created. Check your email for the confirmation link.";
    } catch (error) {
      fail(error.name === "AbortError"
        ? "This is taking too long. Your details are still here; try again in a moment."
        : "We could not create your account. Your details are still here; try again.");
    } finally {
      clearTimeout(timer);
      inFlight = false;
      submit.textContent = "Create account";
    }
  });
})();
</script>
</body>
</html>
