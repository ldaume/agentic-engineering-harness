<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor gauge architecture</title>
<style>
  body { margin: 0; color: #1b1a17; background: #f6f1e7; font: 18px/1.6 Georgia, serif; }
  header { position: sticky; top: 0; z-index: 2; background: #0b5d4b; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  main { max-width: 52rem; margin: 0 auto; padding: 0 16px; }
  .filler { height: 2200px; }
  .scroll { overflow: auto; max-height: 260px; border: 1px solid #b9ad94; }
  svg text { font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <header>
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff"/></svg>
    <strong>Harbor gauge docs</strong>
  </header>
  <main>
    <h1>How the gauge data flows</h1>
    <p>The tide gauge feeds two regions. The diagram sits far below the first screen on purpose.</p>
    <div class="filler"></div>
    <h2>Architecture</h2>
    <div class="scroll">
      <svg class="arch" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Gauge architecture">
        <g class="cluster">
          <rect x="20" y="20" width="330" height="380" fill="#eef1f6" stroke="#8892a6"/>
          <foreignObject x="30" y="26" width="310" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 700 16px Arial, sans-serif; white-space: nowrap; color: #1b1a17">Primary region, north pier, replicated storage tier</div></foreignObject>
        </g>
        <g class="cluster">
          <rect x="410" y="20" width="330" height="380" fill="#eef1f6" stroke="#8892a6"/>
          <text x="420" y="44" font-size="16" font-weight="700">Mirror region</text>
        </g>
        <g class="node"><rect x="60" y="80" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="140" y="110" font-size="15" text-anchor="middle">Gauge reader</text></g>
        <g class="node"><rect x="60" y="200" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="140" y="230" font-size="15" text-anchor="middle">Tide model</text></g>
        <g class="node"><rect x="60" y="320" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="140" y="350" font-size="15" text-anchor="middle">Archive</text></g>
        <g class="node"><rect x="450" y="80" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="530" y="110" font-size="15" text-anchor="middle">Mirror</text></g>
        <g class="node"><rect x="450" y="200" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="530" y="230" font-size="15" text-anchor="middle">Alerts</text></g>
        <g class="node"><rect x="450" y="320" width="160" height="50" fill="#fff" stroke="#0b5d4b"/><text x="530" y="350" font-size="15" text-anchor="middle">Reports</text></g>
        <path class="edge" d="M140 130 L140 320" fill="none" stroke="#333" stroke-width="2"/>
        <path class="edge" d="M220 105 L450 105" fill="none" stroke="#333" stroke-width="2"/>
        <path class="edge" d="M220 225 L450 225" fill="none" stroke="#333" stroke-width="2"/>
        <text x="362" y="160" font-size="14">sync</text>
        <text x="366" y="166" font-size="14">async</text>
      </svg>
    </div>
    <p>After the diagram.</p>
  </main>
</body>
</html>
