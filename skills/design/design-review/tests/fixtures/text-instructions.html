<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ablauf einer Anfrage</title>
<style>
  body { margin: 0; color: #1b1a17; background: #f6f1e7; font: 18px/1.6 Georgia, serif; }
  main { max-width: 40rem; padding: 0 16px; margin: 0 auto; }
  h1 { font: 700 40px/1.1 "Courier New", monospace; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
  <main>
    <h1>Ablauf einer Anfrage</h1>
    <p>Eine Anfrage geht in fünf Schritten vom Eingang bis zur Antwort.</p>
    <figure>
      <div class="scroll"><svg width="900" height="120" aria-label="Fünf Schritte"><rect x="4" y="4" width="160" height="60" fill="none" stroke="#333"/></svg></div>
      <figcaption>Auf dem Handy lässt sich das Diagramm seitlich wischen.</figcaption>
    </figure>
    <p>Der Nutzer klickt auf Freigeben, dann startet der Export.</p>
  </main>
</body>
</html>
