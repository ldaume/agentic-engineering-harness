<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme AI</title>
<style>
  body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; color: #1f1f2e; background: #fff; }
  .hero { text-align: center; padding: 96px 24px; color: #fff; background: linear-gradient(135deg, #6d28d9, #4f46e5); }
  .hero h1 { font-size: 48px; margin: 0 0 16px; }
  .hero p { font-size: 20px; margin: 0 0 32px; }
  .hero a { display: inline-block; padding: 14px 28px; border-radius: 12px; background: #fff; color: #4f46e5; text-decoration: none; }
  .cards { display: flex; gap: 24px; padding: 64px 24px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
  .card { flex: 1 1 280px; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card h3 { margin: 0 0 8px; }
  .glass { margin: 0 auto 64px; max-width: 600px; padding: 24px; border-radius: 12px; border-left: 4px solid #7c3aed; background: rgba(255,255,255,.6); backdrop-filter: blur(12px); }
</style>
</head>
<body>
  <section class="hero">
    <h1>Unlock the power of AI</h1>
    <p>Supercharge your workflow and transform the way your team works.</p>
    <a href="#start">Get started</a>
  </section>
  <section class="cards">
    <div class="card"><h3>🚀 Fast</h3><p>Lightning-fast results for 10,000+ teams.</p></div>
    <div class="card"><h3>🔒 Secure</h3><p>Enterprise-grade security you can trust.</p></div>
    <div class="card"><h3>✨ Smart</h3><p>AI that understands what you need.</p></div>
  </section>
  <div class="glass"><p>"It changed everything." - Jane Doe, CEO</p></div>
</body>
</html>
