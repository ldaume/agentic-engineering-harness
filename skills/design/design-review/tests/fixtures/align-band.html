<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three options</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 Georgia, serif; color: #1b1a17; background: #f6f1e7; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .card { box-sizing: border-box; flex: 1 1 220px; padding: 12px; border: 1px solid #b9ad94; }
  .card h3 { margin: 0 0 8px; font-size: 18px; }
  .card p { margin: 0 0 12px; }
  .card .note { margin: 0; border-top: 1px solid #b9ad94; padding-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <article class="card"><h3>One</h3><p>Short text here.</p><p class="note">Footnote.</p></article>
    <article class="card"><h3>Two</h3><p>A somewhat longer sentence of text here.</p><p class="note">Footnote.</p></article>
    <article class="card"><h3>Three</h3><p>Short text here.</p><p class="note">Footnote.</p></article>
  </div>
</body>
</html>
