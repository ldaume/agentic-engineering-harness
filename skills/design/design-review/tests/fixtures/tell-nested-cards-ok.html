<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested cards ok</title>
<style>body{margin:0;font:16px/1.5 Georgia,serif;color:#111;background:#fff;padding:24px}
.outer{background:#fff;border:1px solid #ddd;border-radius:12px;padding:28px;max-width:480px;margin-bottom:24px}
.tight{padding:12px}
.inner{background:#f8fafc;border:1px solid #ddd;border-radius:10px;padding:16px;margin-top:16px}
.note{background:#f1f5f9;border-radius:10px;padding:16px;margin-top:16px}h3,p{margin:0}</style></head>
<body><div class="outer"><h3>Flat note inside a card</h3><p>All features for growing teams.</p><div class="note"><strong>Included</strong><p>No border, no shadow: not a card.</p></div></div>
<div class="outer tight"><h3>Tight outer padding</h3><div class="inner"><strong>Included</strong><p>Unlimited projects and seats.</p></div></div></body></html>
