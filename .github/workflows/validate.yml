name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILLS_SOURCE: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use latest Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Use current stable Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned catalog tooling
        run: npm ci

      - name: Audit catalog
        run: python3 scripts/audit-skills.py

      - name: Verify plain punctuation
        run: python3 scripts/verify-plain-punctuation.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Test merge gate script
        run: python3 -m unittest discover -s skills/engineering/completion-gate/tests

      - name: Test review-surface attribution check
        run: python3 -m unittest discover -s skills/engineering/scaffold-harness/tests

      - name: Test writing quality gate and golden outputs
        run: python3 -m unittest discover -s skills/writing/progressive-writing-core/tests

      - name: Test design skill scripts
        shell: bash
        run: |
          set -eu
          for t in skills/design/*/tests; do
            if ls "$t"/test_*.py >/dev/null 2>&1; then python3 -m unittest discover -s "$t"; fi
          done

      - name: Check knowledge registries
        run: python3 scripts/check-knowledge.py

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run reference form in a real browser
        run: npx playwright test -c skills/design/progressive-forms-interactions/tests

      - name: Install catalog for supported clients
        shell: bash
        run: |
          set -eu
          target_root="$(mktemp -d)"
          trap 'rm -rf "$target_root"' EXIT
          expected="$(python3 -c 'import json; print(len(json.load(open("skills-lock.json"))["skills"]))')"

          for agent in codex cursor claude-code gemini-cli; do
            target="$target_root/$agent"
            mkdir -p "$target"
            (
              cd "$target"
              "$SKILLS_SOURCE/node_modules/.bin/skills" add "$SKILLS_SOURCE" \
                --skill '*' \
                --agent "$agent" \
                --copy \
                -y
            )

            actual="$(find "$target" -type f -name SKILL.md | wc -l | tr -d ' ')"
            test "$actual" = "$expected"
            test -n "$(find "$target" -type f \
              -path '*/scaffold-harness/CONTEXT-ARCHITECTURE.md' \
              -print -quit)"
          done
