name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    container: node:22-bookworm@sha256:7725a5c2c83eed1d36258c66efae14b1ceccd021db9ed1d9559d3335ed3d68ed
    timeout-minutes: 15
    env:
      # Verified from the npm registry on 2026-07-30. Re-check on CLI updates.
      SKILLS_CLI_VERSION: "1.5.21"
      SKILLS_SOURCE: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends python3

      - name: Audit catalog
        run: python3 scripts/audit-skills.py

      - name: Install catalog for supported clients
        shell: bash
        run: |
          set -eu
          target_root="$(mktemp -d)"
          trap 'rm -rf "$target_root"' EXIT
          expected="$(python3 -c 'import json; print(len(json.load(open("skills-lock.json"))["skills"]))')"

          for agent in codex cursor claude-code gemini-cli; do
            target="$target_root/$agent"
            mkdir -p "$target"
            (
              cd "$target"
              npx --yes "skills@$SKILLS_CLI_VERSION" add "$SKILLS_SOURCE" \
                --skill '*' \
                --agent "$agent" \
                --copy \
                -y
            )

            actual="$(find "$target" -type f -name SKILL.md | wc -l | tr -d ' ')"
            test "$actual" = "$expected"
            test -n "$(find "$target" -type f \
              -path '*/scaffold-harness/CONTEXT-ARCHITECTURE.md' \
              -print -quit)"
          done
